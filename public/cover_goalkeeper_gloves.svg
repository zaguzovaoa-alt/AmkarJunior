<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Stadium Net Pattern -->
    <pattern id="netPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1" />
    </pattern>

    <!-- Spotlights -->
    <radialGradient id="floodlight1" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="floodlight2" cx="80%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="gloveRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#gkBg)" />
  <rect width="1200" height="675" fill="url(#netPattern)" />
  <rect width="1200" height="675" fill="url(#floodlight1)" />
  <rect width="1200" height="675" fill="url(#floodlight2)" />

  <!-- Goal Post Elements -->
  <line x1="80" y1="0" x2="80" y2="675" stroke="#ffffff" stroke-width="14" opacity="0.4" />
  <line x1="80" y1="120" x2="1120" y2="120" stroke="#ffffff" stroke-width="14" opacity="0.4" />
  <line x1="1120" y1="0" x2="1120" y2="675" stroke="#ffffff" stroke-width="14" opacity="0.4" />

  <!-- Turf Base -->
  <rect y="540" width="1200" height="135" fill="#064e3b" opacity="0.7" />
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#ffffff" stroke-width="4" opacity="0.25" />

  <!-- Soccer Ball Suspended in Motion -->
  <g transform="translate(600, 310)" filter="url(#shadowFilter)">
    <!-- Motion lines -->
    <path d="M -140,-10 C -220,-30 -280,-10 -340,30" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.4" stroke-dasharray="10 8" />
    <path d="M -130,20 C -210,10 -270,40 -330,90" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.3" stroke-dasharray="8 6" />

    <!-- Ball -->
    <circle cx="0" cy="0" r="110" fill="#ffffff" />
    <polygon points="0,-35 34,-10 21,30 -21,30 -34,-10" fill="#1e293b" />
    <polygon points="0,-110 30,-75 -30,-75" fill="#0f172a" />
    <polygon points="105,-35 70,-35 50,-70 85,-75" fill="#0f172a" />
    <polygon points="-105,-35 -70,-35 -50,-70 -85,-75" fill="#0f172a" />
    <polygon points="65,90 40,50 75,35 100,60" fill="#0f172a" />
    <polygon points="-65,90 -40,50 -75,35 -100,60" fill="#0f172a" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#000000" stroke-width="3" opacity="0.2" />
  </g>

  <!-- Left Goalkeeper Glove (Reaching) -->
  <g transform="translate(420, 310) rotate(15)" filter="url(#shadowFilter)">
    <!-- Palm & Fingers Base -->
    <rect x="-70" y="-80" width="140" height="150" rx="40" fill="url(#gloveRed)" />
    <!-- Grip Latex Pattern -->
    <circle cx="-35" cy="-40" r="12" fill="#ffffff" opacity="0.3" />
    <circle cx="0" cy="-40" r="12" fill="#ffffff" opacity="0.3" />
    <circle cx="35" cy="-40" r="12" fill="#ffffff" opacity="0.3" />
    <circle cx="-20" cy="0" r="14" fill="#ffffff" opacity="0.3" />
    <circle cx="20" cy="0" r="14" fill="#ffffff" opacity="0.3" />
    <!-- Wrist Strap -->
    <rect x="-65" y="70" width="130" height="45" rx="10" fill="#0f172a" />
    <rect x="-55" y="80" width="110" height="25" rx="6" fill="#1e293b" />
    <line x1="-30" y1="92" x2="30" y2="92" stroke="#dc2626" stroke-width="4" />
  </g>

  <!-- Right Goalkeeper Glove (Catching) -->
  <g transform="translate(780, 310) rotate(-15)" filter="url(#shadowFilter)">
    <!-- Palm & Fingers Base -->
    <rect x="-70" y="-80" width="140" height="150" rx="40" fill="url(#gloveRed)" />
    <!-- Grip Latex Pattern -->
    <circle cx="-35" cy="-40" r="12" fill="#ffffff" opacity="0.3" />
    <circle cx="0" cy="-40" r="12" fill="#ffffff" opacity="0.3" />
    <circle cx="35" cy="-40" r="12" fill="#ffffff" opacity="0.3" />
    <circle cx="-20" cy="0" r="14" fill="#ffffff" opacity="0.3" />
    <circle cx="20" cy="0" r="14" fill="#ffffff" opacity="0.3" />
    <!-- Wrist Strap -->
    <rect x="-65" y="70" width="130" height="45" rx="10" fill="#0f172a" />
    <rect x="-55" y="80" width="110" height="25" rx="6" fill="#1e293b" />
    <line x1="-30" y1="92" x2="30" y2="92" stroke="#dc2626" stroke-width="4" />
  </g>

  <!-- Dynamic Energy Glow Sparks -->
  <circle cx="560" cy="220" r="4" fill="#ffffff" opacity="0.9" />
  <circle cx="640" cy="240" r="5" fill="#f87171" opacity="0.8" />
  <circle cx="600" cy="420" r="6" fill="#38bdf8" opacity="0.7" />
</svg>
