<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Field 3D Angle Gradient -->
    <linearGradient id="fieldGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Turf Striping -->
    <pattern id="turfStripes" width="120" height="675" patternUnits="userSpaceOnUse">
      <rect width="60" height="675" fill="#059669" opacity="0.15" />
      <rect x="60" width="60" height="675" fill="#047857" opacity="0.1" />
    </pattern>

    <!-- Cone Orange Gradient -->
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <filter id="coneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="15" dy="25" stdDeviation="15" flood-color="#022c22" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Pitch Background -->
  <rect width="1200" height="675" fill="url(#fieldGrad)" />
  <rect width="1200" height="675" fill="url(#turfStripes)" />

  <!-- Tactical Pitch Lines -->
  <circle cx="600" cy="337" r="160" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.4" />
  <line x1="600" y1="0" x2="600" y2="675" stroke="#ffffff" stroke-width="4" opacity="0.4" />
  <circle cx="600" cy="337" r="10" fill="#ffffff" opacity="0.5" />
  <rect x="60" y="50" width="1080" height="575" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.4" rx="8" />

  <!-- Tactical Route Arrows (Dynamic Dribbling Path) -->
  <path d="M 240,480 Q 360,240 500,420 T 780,260 T 960,340" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10" opacity="0.75" />
  <polygon points="985,340 955,325 955,355" fill="#fbbf24" opacity="0.8" />

  <!-- Agility Speed Ladder on Ground -->
  <g transform="translate(140, 200) rotate(-15)">
    <line x1="0" y1="0" x2="380" y2="0" stroke="#f8fafc" stroke-width="8" opacity="0.6" />
    <line x1="0" y1="90" x2="380" y2="90" stroke="#f8fafc" stroke-width="8" opacity="0.6" />
    <!-- Rungs -->
    <line x1="50" y1="0" x2="50" y2="90" stroke="#facc15" stroke-width="6" opacity="0.8" />
    <line x1="120" y1="0" x2="120" y2="90" stroke="#facc15" stroke-width="6" opacity="0.8" />
    <line x1="190" y1="0" x2="190" y2="90" stroke="#facc15" stroke-width="6" opacity="0.8" />
    <line x1="260" y1="0" x2="260" y2="90" stroke="#facc15" stroke-width="6" opacity="0.8" />
    <line x1="330" y1="0" x2="330" y2="90" stroke="#facc15" stroke-width="6" opacity="0.8" />
  </g>

  <!-- Training Orange Cones -->
  <!-- Cone 1 -->
  <g transform="translate(360, 270)" filter="url(#coneShadow)">
    <ellipse cx="0" cy="90" rx="65" ry="16" fill="#7c2d12" />
    <polygon points="-60,90 60,90 12,-40 -12,-40" fill="url(#coneGrad)" />
    <!-- White Reflective Stripes -->
    <polygon points="-36,40 36,40 26,10 -26,10" fill="#ffffff" opacity="0.85" />
    <polygon points="-22,0 22,0 15,-20 -15,-20" fill="#ffffff" opacity="0.85" />
    <ellipse cx="0" cy="-40" rx="12" ry="5" fill="#fb923c" />
  </g>

  <!-- Cone 2 -->
  <g transform="translate(680, 240)" filter="url(#coneShadow)">
    <ellipse cx="0" cy="90" rx="65" ry="16" fill="#7c2d12" />
    <polygon points="-60,90 60,90 12,-40 -12,-40" fill="url(#coneGrad)" />
    <polygon points="-36,40 36,40 26,10 -26,10" fill="#ffffff" opacity="0.85" />
    <polygon points="-22,0 22,0 15,-20 -15,-20" fill="#ffffff" opacity="0.85" />
    <ellipse cx="0" cy="-40" rx="12" ry="5" fill="#fb923c" />
  </g>

  <!-- Cone 3 -->
  <g transform="translate(860, 420)" filter="url(#coneShadow)">
    <ellipse cx="0" cy="90" rx="65" ry="16" fill="#7c2d12" />
    <polygon points="-60,90 60,90 12,-40 -12,-40" fill="url(#coneGrad)" />
    <polygon points="-36,40 36,40 26,10 -26,10" fill="#ffffff" opacity="0.85" />
    <polygon points="-22,0 22,0 15,-20 -15,-20" fill="#ffffff" opacity="0.85" />
    <ellipse cx="0" cy="-40" rx="12" ry="5" fill="#fb923c" />
  </g>

  <!-- Official Training Soccer Ball -->
  <g transform="translate(520, 440)" filter="url(#coneShadow)">
    <circle cx="0" cy="0" r="95" fill="#ffffff" />
    <polygon points="0,-30 28,-10 18,25 -18,25 -28,-10" fill="#dc2626" />
    <polygon points="0,-95 25,-65 -25,-65" fill="#0f172a" />
    <polygon points="90,-30 60,-30 42,-60 72,-65" fill="#0f172a" />
    <polygon points="-90,-30 -60,-30 -42,-60 -72,-65" fill="#0f172a" />
    <polygon points="55,75 35,42 65,30 85,50" fill="#0f172a" />
    <polygon points="-55,75 -35,42 -65,30 -85,50" fill="#0f172a" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#000000" stroke-width="2.5" opacity="0.15" />
  </g>
</svg>
