<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Sunset Pitch Glow -->
    <linearGradient id="psyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="35%" stop-color="#7f1d1d" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Golden Light -->
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <filter id="softGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#psyBg)" />
  <rect width="1200" height="675" fill="url(#sunGlow)" />

  <!-- Stadium Pitch Turf Horizon -->
  <path d="M 0,460 Q 600,420 1200,460 L 1200,675 L 0,675 Z" fill="#064e3b" opacity="0.85" />
  <line x1="0" y1="460" x2="1200" y2="460" stroke="#ffffff" stroke-width="3" opacity="0.2" />

  <!-- Heart / Courage Shield in Center -->
  <g transform="translate(600, 270)" filter="url(#softGlowFilter)">
    <!-- Outer Shield Crest -->
    <path d="M 0,-150 L 130,-70 L 130,50 C 130,130 0,180 0,180 C 0,180 -130,130 -130,50 L -130,-70 Z" fill="url(#shieldGrad)" stroke="#fef08a" stroke-width="6" />
    <!-- Inner Star / Spark of Confidence -->
    <polygon points="0,-70 20,-20 70,-20 30,10 45,60 0,30 -45,60 -30,10 -70,-20 -20,-20" fill="#fef08a" />
    <circle cx="0" cy="0" r="14" fill="#dc2626" />
  </g>

  <!-- Left: Team High Five / Handshake Emblem -->
  <g transform="translate(260, 320)" filter="url(#softGlowFilter)">
    <circle cx="0" cy="0" r="85" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
    <!-- Friendly High Five / Palm Icon -->
    <path d="M -30,20 L -30,-20 Q -30,-40 -15,-40 Q 0,-40 0,-20 L 0,-35 Q 0,-50 15,-50 Q 30,-50 30,-35 L 30,20 Z" fill="#38bdf8" opacity="0.85" />
    <circle cx="0" cy="40" r="8" fill="#ffffff" />
  </g>

  <!-- Right: Soccer Ball with Victory Laurel Wings -->
  <g transform="translate(940, 320)" filter="url(#softGlowFilter)">
    <circle cx="0" cy="0" r="90" fill="#ffffff" />
    <polygon points="0,-28 26,-9 16,24 -16,24 -26,-9" fill="#0f172a" />
    <polygon points="0,-90 22,-60 -22,-60" fill="#0f172a" />
    <polygon points="85,-28 55,-28 38,-55 68,-60" fill="#0f172a" />
    <polygon points="-85,-28 -55,-28 -38,-55 -68,-60" fill="#0f172a" />
    <!-- Laurel Wreath Branch Accent -->
    <path d="M -90,70 C -120,30 -120,-30 -80,-80" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
    <path d="M 90,70 C 120,30 120,-30 80,-80" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Inspirational Sparkles -->
  <circle cx="480" cy="140" r="4" fill="#fef08a" opacity="0.8" />
  <circle cx="720" cy="120" r="5" fill="#fef08a" opacity="0.7" />
  <circle cx="380" cy="480" r="3" fill="#ffffff" opacity="0.6" />
  <circle cx="820" cy="490" r="4" fill="#ffffff" opacity="0.6" />
</svg>
